<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120d09">
  <title>Syntra — Your scent in AR</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f6eee3; --soft: rgba(246, 238, 227, .72); --glass: rgba(20, 14, 10, .5);
      --serif: 'Instrument Serif', Georgia, serif; --sans: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d09; color: var(--ink); font-family: var(--sans); }
    #ar, #view { position: fixed; inset: 0; }
    #ar video { object-fit: cover; }
    .ui { position: fixed; z-index: 10; pointer-events: none; }
    .ui > * { pointer-events: auto; }

    /* scanning */
    #scan { inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .6s var(--ease); }
    #scan.on { opacity: 1; }
    .frame { width: min(62vw, 300px); aspect-ratio: 1; position: relative; }
    .frame i { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ink); animation: breathe 2.4s var(--ease) infinite; }
    .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
    .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
    .frame i:nth-child(3) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
    .frame i:nth-child(4) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
    @keyframes breathe { 50% { transform: scale(.92); opacity: .6; } }
    .pill {
      position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 14px 22px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      font: 600 12px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; text-align: center; white-space: nowrap;
      opacity: 0; transition: opacity .5s var(--ease);
    }
    .pill.on { opacity: 1; }
    #brand { top: calc(18px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font: 700 11px/1 var(--sans); letter-spacing: .34em; color: var(--ink); text-shadow: 0 1px 8px rgba(0,0,0,.5); opacity: 0; transition: opacity .6s; }
    #brand.on { opacity: .9; }
    #pname { top: calc(38px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -6px); text-align: center; white-space: nowrap;
             opacity: 0; transition: opacity .8s var(--ease), transform .8s var(--ease); text-shadow: 0 1px 12px rgba(0,0,0,.55); pointer-events: none; }
    #pname.on { opacity: 1; transform: translate(-50%, 0); }
    #pname .n { font: 400 clamp(26px, 7vw, 38px)/1.05 var(--serif); color: var(--ink); }
    #pname .m { margin-top: 5px; font: 700 10px/1 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--soft); }
    #loading { inset: 0; display: grid; place-items: center; font: italic 26px var(--serif); color: var(--soft); background: #120d09; opacity: 0; pointer-events: none; transition: opacity .5s; }
    #loading.on { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="ar"></div>
  <div id="view"></div>

  <section id="scan" class="ui" aria-hidden="true"><div class="frame"><i></i><i></i><i></i><i></i></div></section>
  <div id="brand" class="ui">SYNTRA</div>
  <div id="pname" class="ui"><div class="n"></div><div class="m"></div></div>
  <p id="hint" class="ui pill"></p>
  <div id="loading" class="ui on">Opening camera…</div>

  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
  <script type="module" src="ar.js?v=lite1"></script>
</body>
</html>
